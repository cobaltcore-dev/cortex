apiVersion: cortex.cloud/v1alpha1
kind: Pipeline
metadata:
  name: nova-contention-demo
spec:
  schedulingDomain: nova
  type: filter-weigher
  filters:
    - name: filter_expression
      params:
        - key: run
          stringValue: |
            any(contention,
              .ComputeHost == host &&
              .AvgCPUContention < 50)
        - key: knowledges
          stringListMapValue:
            contention: [host-cpu-contention]

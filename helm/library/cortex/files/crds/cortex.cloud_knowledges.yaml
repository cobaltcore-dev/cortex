---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: knowledges.cortex.cloud
spec:
  group: cortex.cloud
  names:
    kind: Knowledge
    listKind: KnowledgeList
    plural: knowledges
    singular: knowledge
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedulingDomain
      name: Domain
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Created
      type: date
    - jsonPath: .status.lastExtracted
      name: Extracted
      type: date
    - jsonPath: .status.lastContentChange
      name: Changed
      type: date
    - jsonPath: .spec.recency
      name: Recency
      type: string
    - jsonPath: .status.rawLength
      name: Features
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Knowledge is the Schema for the knowledges API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Knowledge
            properties:
              description:
                description: A human-readable description of the knowledge to be extracted.
                type: string
              expression:
                description: The expression to use for extracting this knowledge.
                properties:
                  output:
                    description: |-
                      Name of the registered go type of a single output feature. The output
                      of the expression is strictly decoded into a list of this type, so
                      consumers can unbox the knowledge with the same type.
                    type: string
                  run:
                    description: |-
                      Expression (https://expr-lang.org) evaluated over the inputs, which are
                      available as variables named by their var. Fields of input objects are
                      accessed by their go field names. The expression must return a list.
                    type: string
                required:
                - output
                - run
                type: object
              extractor:
                description: The go feature extractor to use for extracting this knowledge.
                properties:
                  config:
                    description: Additional configuration for the extractor.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  name:
                    description: The name of the go extractor registered in cortex.
                    type: string
                required:
                - name
                type: object
              inputs:
                description: |-
                  Inputs passed to the extractor or expression. Changes to the referenced
                  datasources and knowledges trigger a re-extraction of this knowledge.
                items:
                  description: |-
                    InputSpec references a datasource or another knowledge whose objects are
                    passed to a knowledge extractor or kpi under the given variable name.
                  properties:
                    datasource:
                      description: Name of the datasource providing the input objects.
                      type: string
                    knowledge:
                      description: Name of the knowledge providing its extracted features
                        as input objects.
                      type: string
                    var:
                      description: |-
                        Name under which the input objects are passed, e.g. to an expression
                        or to the struct field tagged with `input:"<var>"` in a go extractor.
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      type: string
                  required:
                  - var
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of datasource or knowledge must be set
                    rule: has(self.datasource) != has(self.knowledge)
                type: array
                x-kubernetes-list-map-keys:
                - var
                x-kubernetes-list-type: map
              recency:
                default: 60s
                description: |-
                  The desired recency of this knowledge, i.e. how old it can be until
                  it needs to be re-extracted.
                type: string
              schedulingDomain:
                description: |-
                  SchedulingDomain defines in which scheduling domain this knowledge
                  is used (e.g., nova, cinder, manila).
                type: string
            required:
            - recency
            - schedulingDomain
            type: object
            x-kubernetes-validations:
            - message: exactly one of extractor or expression must be set
              rule: has(self.extractor) != has(self.expression)
          status:
            description: status defines the observed state of Knowledge
            properties:
              conditions:
                description: The current status conditions of the knowledge.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastContentChange:
                description: |-
                  When the extracted knowledge content last changed.
                  Updated only when the Raw data actually changes, not on every reconcile.
                format: date-time
                type: string
              lastExtracted:
                description: When the knowledge was last successfully extracted.
                format: date-time
                type: string
              raw:
                description: The raw data behind the extracted knowledge, e.g. a list
                  of features.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              rawLength:
                description: The number of features extracted, or 1 if the knowledge
                  is not a list.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

deployment:
  enable: true
  replicas: 3
  container:
    image:
      repository: ghcr.io/cobaltcore-dev/cortex-shim
    args:
      - "--api-bind-address=:8080"
      - "--metrics-bind-address=:2112"
      - "--health-probe-bind-address=:8081"
      - "--metrics-secure=false"
    extraArgs: []
    resources:
      limits:
        cpu: 500m
        memory: 2048Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: shim

# [INGRESS]: To expose the placement shim via an Ingress, set enabled true AND
# provide ingress.rules. The Ingress is only rendered when both are set: an
# Ingress with no rules is invalid, and local/dev setups (e.g. tilt) enable the
# shim without any ingress rules and expect no Ingress to be created.
ingress:
  # Enable or disable the ingress resource for the placement shim. Note this is
  # necessary but not sufficient: ingress.rules must also be provided for the
  # Ingress to be rendered.
  enabled: true
  # Which ingress controller to use.
  className: nginx
  # The routing rules for the Ingress. Deployments must supply these; there is
  # no sensible default host, so the library ships this empty and renders no
  # Ingress until it is set. See networking.k8s.io/v1 Ingress .spec.rules.
  rules: []
  # Optional TLS configuration for the Ingress (networking.k8s.io/v1
  # Ingress .spec.tls). Left empty by default.
  tls: []
  # Override this default set of annotations if needed.
  annotations:
    # Enables https://github.com/sapcc/disco
    disco: "true"
    # Enables automatic TLS certificate provisioning via cert-manager.
    kubernetes.io/tls-acme: "true"

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and remove the container args
# "--metrics-bind-address=:2112" and "--metrics-secure=false".
metrics:
  enable: true

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: true
  extraLabels: {} # Additional labels to add to the ServiceMonitor, e.g. for Prometheus Service Discovery.

# Use this to unambiguate multiple cortex deployments in the same cluster.
namePrefix: cortex
conf: {} # No config for now that's needed by all the shims.

global:
  conf: {} # No global config for now that's needed by all the shims.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cortex-scheduling-quality-exporter.serviceAccountName" . }}
  labels:
    {{- include "cortex-scheduling-quality-exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

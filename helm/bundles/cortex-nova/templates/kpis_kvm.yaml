{{- if .Values.kvm.enabled }}
---
apiVersion: cortex.cloud/v1alpha1
kind: KPI
metadata:
  name: kvm-host-capacity
spec:
  schedulingDomain: nova
  impl: kvm_host_capacity_kpi
  dependencies:
    knowledges:
      - name: host-details
      - name: host-utilization
  description: |
    This KPI tracks the total, utilized, reserved and failover capacity of KVM hosts.
---
apiVersion: cortex.cloud/v1alpha1
kind: KPI
metadata:
  name: kvm-project-utilization
spec:
  schedulingDomain: nova
  impl: kvm_project_utilization_kpi
  dependencies:
    datasources:
      - name: nova-servers
      - name: nova-flavors
      - name: identity-projects
      - name: identity-domains
---
apiVersion: cortex.cloud/v1alpha1
kind: KPI
metadata:
  name: kvm-hana-stacking
spec:
  schedulingDomain: nova
  impl: kvm_hana_stacking_kpi
  dependencies:
    datasources:
      - name: nova-servers
      - name: nova-flavors
      - name: identity-projects
      - name: identity-domains
---
apiVersion: cortex.cloud/v1alpha1
kind: KPI
metadata:
  name: multicluster-object-count
spec:
  schedulingDomain: nova
  impl: multicluster_object_count_kpi
  opts:
    gvks:
      - cortex.cloud/v1alpha1/HistoryList
      - cortex.cloud/v1alpha1/ReservationList
      - cortex.cloud/v1alpha1/CommittedResourceList
      - kvm.cloud.sap/v1/HypervisorList
  description: |
    This KPI reports the number of objects of each configured GVK per cluster
    (home and remote), labelled by the configured cluster labels. Home-cluster
    metrics use is_home=true with empty routing-label values. It uses
    PartialObjectMetadataList so only object metadata is fetched, making it
    efficient even for large object counts.
{{- end }}
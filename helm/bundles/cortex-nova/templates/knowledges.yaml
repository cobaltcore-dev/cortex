---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vmware-resolved-hostsystems
spec:
  schedulingDomain: nova
  expression:
    run: |
      let serversByID = groupBy(servers, .ID);
      metrics
      | filter(len(serversByID[.InstanceUUID] ?? []) > 0)
      | map(let o = #; {
          VROpsHostsystem: .HostSystem,
          NovaComputeHost: last(serversByID[.InstanceUUID]).OSEXTSRVATTRHost,
        })
      | filter(.NovaComputeHost != "")
      | groupBy(.VROpsHostsystem + "\x00" + .NovaComputeHost)
      | values()
      | map(#[0])
      | sortBy(.VROpsHostsystem + "\x00" + .NovaComputeHost)
  description: |
    This knowledge resolves the hostsystem label provided to the vrops
    prometheus metrics to the associated nova hypervisor compute host.
  recency: "1h"
  inputs:
    - var: metrics
      datasource: vrops-virtualmachine-cpu-demand-ratio
    - var: servers
      datasource: nova-servers
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vmware-project-noisiness
spec:
  schedulingDomain: nova
  expression:
    run: |
      let metricsByProject = groupBy(metrics, .Project);
      let metricsByServer = groupBy(metrics, .InstanceUUID);
      let hypervisorsByHostname = groupBy(hypervisors, .Hostname);
      servers
      | filter(len(metricsByServer[.ID] ?? []) > 0 && len(metricsByProject[.TenantID] ?? []) > 0)
      | map(let s = #; (hypervisorsByHostname[s.OSEXTSRVATTRHypervisorHostname] ?? []) | map(let o = #; {
          Project:         s.TenantID,
          ComputeHost:     .ServiceHost,
          AvgCPUOfProject: mean(map(metricsByProject[s.TenantID], .Value)),
        }))
      | flatten()
      | groupBy(.Project + "\x00" + .ComputeHost)
      | values()
      | map(#[0])
      | sortBy(.Project + "\x00" + .ComputeHost)
  description: |
    This knowledge calculates how noisy projects are in terms of CPU contention
    on their VMs' hostsystems.
  recency: "6h"
  inputs:
    - var: metrics
      datasource: vrops-virtualmachine-cpu-demand-ratio
    - var: servers
      datasource: nova-servers
    - var: hypervisors
      datasource: nova-hypervisors
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vmware-long-term-contended-hosts
spec:
  schedulingDomain: nova
  expression:
    run: |
      let computeHostByHostsystem = groupBy(resolvedHostsystems, .VROpsHostsystem);
      metrics
      | groupBy(.HostSystem)
      | values()
      | filter(len(computeHostByHostsystem[#[0].HostSystem] ?? []) > 0)
      | map(let o = #; {
          computeHost: last(computeHostByHostsystem[#[0].HostSystem]).NovaComputeHost,
          avg: mean(map(#, .Value)),
          max: max(map(#, .Value)),
        })
      | groupBy(.computeHost)
      | values()
      | map(let o = #; {
          ComputeHost:      #[0].computeHost,
          AvgCPUContention: mean(map(#, .avg)),
          MaxCPUContention: max(max(map(#, .max)), 0),
        })
      | sortBy(.ComputeHost)
  description: |
    This knowledge identifies hostsystems that have been contended for
    long periods of time.
  inputs:
    - var: metrics
      datasource: vrops-hostsystem-cpu-contention-long-term-percentage
    - var: resolvedHostsystems
      knowledge: vmware-resolved-hostsystems
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vmware-short-term-contended-hosts
spec:
  schedulingDomain: nova
  expression:
    run: |
      let computeHostByHostsystem = groupBy(resolvedHostsystems, .VROpsHostsystem);
      metrics
      | groupBy(.HostSystem)
      | values()
      | filter(len(computeHostByHostsystem[#[0].HostSystem] ?? []) > 0)
      | map(let o = #; {
          computeHost: last(computeHostByHostsystem[#[0].HostSystem]).NovaComputeHost,
          avg: mean(map(#, .Value)),
          max: max(map(#, .Value)),
        })
      | groupBy(.computeHost)
      | values()
      | map(let o = #; {
          ComputeHost:      #[0].computeHost,
          AvgCPUContention: mean(map(#, .avg)),
          MaxCPUContention: max(max(map(#, .max)), 0),
        })
      | sortBy(.ComputeHost)
  description: |
    This knowledge identifies hostsystems that have been contended for short
    periods of time.
  inputs:
    - var: metrics
      datasource: vrops-hostsystem-cpu-contention-short-term-percentage
    - var: resolvedHostsystems
      knowledge: vmware-resolved-hostsystems


---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: host-pinned-projects
spec:
  schedulingDomain: nova
  extractor:
    name: host_pinned_projects_extractor
  description: |
    This knowledge extracts host-to-project pinning relationships from Nova
    aggregates.
  recency: "5m"
  inputs:
    - var: aggregates
      datasource: nova-aggregates
    - var: hypervisors
      datasource: nova-hypervisors
    - var: projects
      datasource: identity-projects
    - var: domains
      datasource: identity-domains
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: host-utilization
spec:
  schedulingDomain: nova
  expression:
    run: |
      let inventory = groupBy(inventoryUsages, .ResourceProviderUUID + "\x00" + .InventoryClassName);
      hypervisors
      | filter(let h = #; all(["MEMORY_MB", "VCPU", "DISK_GB"], len(inventory[h.ID + "\x00" + #] ?? []) > 0))
      | map(
          let h = #;
          let ram = last(inventory[h.ID + "\x00MEMORY_MB"]);
          let vcpu = last(inventory[h.ID + "\x00VCPU"]);
          let disk = last(inventory[h.ID + "\x00DISK_GB"]);
          let ramTotal = (ram.Total - ram.Reserved) * ram.AllocationRatio;
          let vcpuTotal = (vcpu.Total - vcpu.Reserved) * vcpu.AllocationRatio;
          let diskTotal = (disk.Total - disk.Reserved) * disk.AllocationRatio;
          {
            computeHost:            h.ServiceHost,
            vcpusUsed:              vcpu.Used,
            vcpusUtilizedPct:       vcpuTotal == 0 ? 0 : vcpu.Used / vcpuTotal * 100,
            totalVCPUsAllocatable:  vcpuTotal,
            ramUsedMB:              ram.Used,
            ramUtilizedPct:         ramTotal == 0 ? 0 : ram.Used / ramTotal * 100,
            totalRAMAllocatableMB:  ramTotal,
            diskUsedGB:             disk.Used,
            diskUtilizedPct:        diskTotal == 0 ? 0 : disk.Used / diskTotal * 100,
            totalDiskAllocatableGB: diskTotal,
          })
      | sortBy(.computeHost)
  description: |
    This knowledge calculates how much space is available on each host.
    Note that this doesn't consider reservations placed on the hosts.
  recency: "60s"
  inputs:
    - var: hypervisors
      datasource: nova-hypervisors
    - var: inventoryUsages
      datasource: placement-resource-provider-inventory-usages
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: host-capabilities
spec:
  schedulingDomain: nova
  expression:
    run: |
      let traitsByProvider = groupBy(traits, .ResourceProviderUUID);
      hypervisors
      | filter(len(traitsByProvider[.ID] ?? []) > 0)
      | groupBy(.ServiceHost + "\x00" + .HypervisorType)
      | values()
      | map(let g = #; {
          ComputeHost:    g[0].ServiceHost,
          HypervisorType: g[0].HypervisorType,
          Traits:         g | map(traitsByProvider[.ID]) | flatten() | map(.Name) | sort() | join(","),
        })
      | sortBy(.ComputeHost + "\x00" + .HypervisorType)
  description: |
    This knowledge extracts compute capabilities of each host.
  recency: "60s"
  inputs:
    - var: hypervisors
      datasource: nova-hypervisors
    - var: traits
      datasource: placement-resource-provider-traits
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vm-host-residency
spec:
  schedulingDomain: nova
  extractor:
    name: vm_host_residency_extractor
  description: |
    This knowledge calculates how long VMs have been running on their host
    until they were migrated away.
  recency: "60s"
  inputs:
    - var: migrations
      datasource: nova-migrations
    - var: servers
      datasource: nova-servers
    - var: flavors
      datasource: nova-flavors
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vm-life-span
spec:
  schedulingDomain: nova
  extractor:
    name: vm_life_span_histogram_extractor
  description: |
    This knowledge calculates how long VMs have been running until they were
    deleted. The information is aggregated in histogram buckets.
  recency: "60s"
  inputs:
    - var: servers
      datasource: nova-servers
    - var: deletedServers
      datasource: nova-deleted-servers
    - var: flavors
      datasource: nova-flavors
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: host-az
spec:
  schedulingDomain: nova
  expression:
    run: |
      let azsByHost = aggregates
        | filter(.ComputeHost != nil && .AvailabilityZone != nil)
        | groupBy(.ComputeHost + "");
      hypervisors
      | map(let o = #; {
          ComputeHost:      .ServiceHost,
          AvailabilityZone: (azsByHost[.ServiceHost] ?? []) | map(.AvailabilityZone + "") | sort() | first(),
        })
      | sortBy(.ComputeHost)
  description: |
    This knowledge extracts which availability zone each host belongs to.
  recency: "60s"
  inputs:
    - var: hypervisors
      datasource: nova-hypervisors
    - var: aggregates
      datasource: nova-aggregates
---
apiVersion: cortex.cloud/v1alpha1
kind: Knowledge
metadata:
  name: vmware-host-details
spec:
  schedulingDomain: nova
  extractor:
    name: vmware_host_details_extractor
  description: |
    This knowledge extracts details of VMware compute hosts. KVM hosts are
    served by a dedicated CRD and ironic hosts are excluded.
  recency: "60s"
  inputs:
    - var: hypervisors
      datasource: nova-hypervisors
    - var: traits
      datasource: placement-resource-provider-traits
    - var: inventoryUsages
      datasource: placement-resource-provider-inventory-usages
    - var: aggregates
      datasource: nova-aggregates
    - var: pinnedProjects
      knowledge: host-pinned-projects
    - var: hostAZs
      knowledge: host-az

---
apiVersion: cortex.cloud/v1alpha1
kind: Datasource
metadata:
  name: cinder-storage-pools
spec:
  schedulingDomain: cinder
  storage:
    type: valkey
    valkey:
      secretRef:
        name: cortex-cinder-valkey
        namespace: {{ .Release.Namespace }}
  {{- if .Values.openstack.sso.enabled }}
  ssoSecretRef:
    name: cortex-cinder-openstack-sso
    namespace: {{ .Release.Namespace }}
  {{- end }}
  type: openstack
  openstack:
    secretRef:
      name: cortex-cinder-openstack-keystone
      namespace: {{ .Release.Namespace }}
    type: cinder
    cinder:
      type: storagePools

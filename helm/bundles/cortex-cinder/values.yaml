owner-info:
  enabled: true
  helm-chart-url: "https://github.com/cobaltcore-dev/cortex/helm/bundles/cortex-cinder"
  maintainers:
    - "arno.uhlig@sap.com"
    - "julius.clausnitzer@sap.com"
    - "malte.viering@sap.com"
    - "marcel.gute@sap.com"
    - "markus.wieland@sap.com"
    - "p.matthes@sap.com"
  support-group: "workload-management"
  service: "cortex-cinder"

alerts:
  enabled: true
  prometheus: openstack
  # Base URL (no trailing slash) for Perses dashboard links emitted as the
  # `persesDashboard` label on each alert. The per-alert dashboard slug is
  # appended to it. The value is templateable with Prometheus label expressions,
  # e.g. a region-specific host:
  #   https://perses.{{ $labels.region }}.example.com/projects/observability/dashboards
  # Left empty by default so no persesDashboard label is emitted.
  persesDashboardBaseURL: ""
  thresholds:
    # Fraction of each pod's configured container memory limit above which
    # CortexCinderHighMemoryUsage fires. The alert joins process_resident_memory_bytes
    # against kube_pod_container_resource_limits per pod, so it stays correct
    # across per-region limit overrides without hand-maintained MiB values.
    # 0.8 = 80% of the limit.
    highMemoryFraction: 0.8
    # Fraction of each pod's configured container CPU limit above which
    # CortexCinderHighCPUUsage fires. Mirrors highMemoryFraction. 0.8 = 80% of the limit.
    highCPUFraction: 0.8

serviceMonitor:
  extraLabels: {}

# SSO certificate to use.
sharedSSOCert: &sharedSSOCert
  # Certificate "public key". (Optional, remove this key if not needed)
  cert: |
    -----BEGIN CERTIFICATE-----
    Your certificate here
    -----END CERTIFICATE-----
  # Certificate private key. (Optional, remove this key if not needed)
  key: |
    -----BEGIN PRIVATE KEY-----
    Your private key here
    -----END PRIVATE KEY-----
  # Whether the certificate is self-signed.
  # If true, the certificate is not verified.
  selfSigned: "false"

# Connection to the valkey server in which the datasources store their objects.
# Rendered into the secret cortex-cinder-valkey, which also provides the password
# of the valkey default user.
store:
  host: cortex-cinder-valkey
  port: "6379"
  password: secret

prometheus:
  url: "https://path-to-your-prometheus"
  sso:
    enabled: false
    <<: *sharedSSOCert

openstack:
  url: "https://path-to-keystone/v3"
  availability: public
  username: openstack-user-with-all-project-read-access
  password: openstack-user-password
  projectName: openstack-project-of-user
  userDomainName: openstack-domain-of-user
  projectDomainName: openstack-domain-of-project-scoped-to
  sso:
    enabled: false
    <<: *sharedSSOCert

cortex: &cortex
  crd: {enable: false}
  # Disable the default ServiceMonitor and metrics service from the kubebuilder stack.
  # A centralized ServiceMonitor and metrics service are defined in the cortex-cinder chart.
  metrics: {enable: false}
  prometheus: {enable: false}
  conf: &cortexConf
    schedulingDomain: cinder
    apiservers:
      home:
        gvks:
          - cortex.cloud/v1alpha1/Descheduling
          - cortex.cloud/v1alpha1/DeschedulingList
          - cortex.cloud/v1alpha1/Rescheduling
          - cortex.cloud/v1alpha1/ReschedulingList
          - cortex.cloud/v1alpha1/Pipeline
          - cortex.cloud/v1alpha1/PipelineList
          - cortex.cloud/v1alpha1/Knowledge
          - cortex.cloud/v1alpha1/KnowledgeList
          - cortex.cloud/v1alpha1/Datasource
          - cortex.cloud/v1alpha1/DatasourceList
          - cortex.cloud/v1alpha1/KPI
          - cortex.cloud/v1alpha1/KPIList
          - cortex.cloud/v1alpha1/Reservation
          - cortex.cloud/v1alpha1/ReservationList
          - v1/Secret
    keystoneSecretRef:
      name: cortex-cinder-openstack-keystone
      namespace: default
    # ssoSecretRef:
    #   name: cortex-cinder-openstack-sso
    #   namespace: default
    monitoring:
      labels: &cortexMonitoringLabels
        github_org: cobaltcore-dev
        github_repo: cortex

# Split deployments
cortex-scheduling-controllers:
  <<: *cortex
  namePrefix: cortex-cinder-scheduling
  # Enable webhook that will validate CRDs for the scheduling controllers.
  webhook: {enable: true}
  certmanager: {enable: true} # Needed for the webhook TLS certificates.
  conf:
    <<: *cortexConf
    leaderElectionID: cortex-cinder-scheduling
    monitoring:
      labels:
        <<: *cortexMonitoringLabels
        component: cinder-scheduling
    enabledControllers:
      - cinder-decisions-pipeline-controller

cortex-knowledge-controllers:
  <<: *cortex
  namePrefix: cortex-cinder-knowledge
  conf:
    <<: *cortexConf
    leaderElectionID: cortex-cinder-knowledge
    monitoring:
      labels:
        <<: *cortexMonitoringLabels
        component: cinder-knowledge
    enabledControllers:
      - datasource-controllers
      - knowledge-controllers
      - kpis-controller

# Custom configuration for the valkey chart, see https://valkey.io/valkey-helm/.
valkey:
  fullnameOverride: cortex-cinder-valkey
  auth:
    enabled: true
    usersExistingSecret: cortex-cinder-valkey
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  # Datasources sync again when valkey lost its data, so no volume is needed.
  persistence:
    enabled: false

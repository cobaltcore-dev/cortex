name: Lint
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}
permissions:
  checks: write
  contents: read
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Run make crds deepcopy lint-fix
        run: make crds deepcopy lint-fix
      - name: Check for diff
        run: |
          set -e
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make crds deepcopy lint-fix' and commit the changes."
            exit 1
          fi
          if git ls-files --others --exclude-standard | grep -q .; then
            echo "::error::Untracked files after generation:"
            git ls-files --others --exclude-standard
            exit 1
          fi
      - name: Run golangci-lint
        run: |
          set -eux
          make lint

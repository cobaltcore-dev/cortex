# Cortex Agents hub for cortex itself — a thin stub like every other consumer,
# calling the shared entry workflow from this repository at the running commit.
# All gating, config parsing, and fan-out live in cortex-agents-entry.yaml;
# the entry workflow re-clones cortex at its own commit to reuse the shared
# actions and passes that commit down to the feature workflows.

name: Cortex Agents

on:
  # pull_request_target is required so the agents can comment on and review
  # fork PRs (fork pull_request events carry no secrets). The entry workflow is
  # fork-safe: it checks out the base ref, never the fork head, and gates every
  # agent job behind an allowlist. See cortex-agents-entry.yaml.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * 1"  # 06:00 UTC every Monday — bugfinder + docswriter
  workflow_dispatch:
    inputs:
      feature:
        description: "Which feature to run (bugfinder, docswriter). Leave empty to run both scheduled features."
        required: false
        default: ""

# Consent to the union of permissions the cortex agents may request; GitHub
# lets called workflows only maintain or reduce this grant, never elevate it.
# Every job inside the entry workflow downgrades to what it actually uses.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  cortex-agents:
    uses: ./.github/workflows/cortex-agents-entry.yaml
    # Forward only the secrets the entry workflow declares, rather than
    # inheriting the caller's entire secret set.
    secrets:
      AICORE_RESOURCE_GROUP: ${{ secrets.AICORE_RESOURCE_GROUP }}
      AICORE_BASE_URL: ${{ secrets.AICORE_BASE_URL }}
      AICORE_AUTH_URL: ${{ secrets.AICORE_AUTH_URL }}
      AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
      AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
      CORTEX_AI_AGENTS_APP_ID: ${{ secrets.CORTEX_AI_AGENTS_APP_ID }}
      CORTEX_AI_AGENTS_CLIENT_PKEY: ${{ secrets.CORTEX_AI_AGENTS_CLIENT_PKEY }}

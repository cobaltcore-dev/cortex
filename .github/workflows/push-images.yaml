name: Build and Push Docker Images
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only build and push the postgres image if there are changes in the
      # postgres directory.
      - name: Get all changed postgres/ files
        id: changed_postgres_files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            postgres/**
      - name: Docker Meta (Cortex Postgres)
        if: steps.changed_postgres_files.outputs.all_changed_files != ''
        id: meta_cortex_postgres
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-postgres
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            latest
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
      - name: Build and Push Cortex Postgres
        if: steps.changed_postgres_files.outputs.all_changed_files != ''
        id: push_cortex_postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_cortex_postgres.outputs.tags }}
          labels: ${{ steps.meta_cortex_postgres.outputs.labels }}
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
      - name: Generate Artifact Attestation for Cortex Postgres
        if: steps.changed_postgres_files.outputs.all_changed_files != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-postgres
          subject-digest: ${{ steps.push_cortex_postgres.outputs.digest }}
          push-to-registry: true

      # Only build and push the cortex-shim image if there are changes related
      # to the cortex shims (e.g., in cmd/shim or internal/shim).
      - name: Get all changed shim/ files
        id: changed_shim_files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            cmd/shim/**
            internal/shim/**
            api/**
            pkg/**
            go.mod
            go.sum
            Dockerfile
      - name: Docker Meta (Cortex Shim)
        if: steps.changed_shim_files.outputs.all_changed_files != ''
        id: meta_cortex_shim
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-shim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            latest
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
      - name: Build and Push Cortex Shim
        if: steps.changed_shim_files.outputs.all_changed_files != ''
        id: push_cortex_shim
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_cortex_shim.outputs.tags }}
          labels: ${{ steps.meta_cortex_shim.outputs.labels }}
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GOMAIN=cmd/shim/main.go
      - name: Generate Artifact Attestation for Cortex Shim
        if: steps.changed_shim_files.outputs.all_changed_files != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-shim
          subject-digest: ${{ steps.push_cortex_shim.outputs.digest }}
          push-to-registry: true

      # Build & push new cortex image
      - name: Docker Meta (Cortex)
        id: meta_cortex
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            latest
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
      - name: Build and Push Cortex
        id: push_cortex
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_cortex.outputs.tags }}
          labels: ${{ steps.meta_cortex.outputs.labels }}
          build-args: |
            GIT_TAG=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GOMAIN=cmd/manager/main.go
      - name: Generate Artifact Attestation for Cortex
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push_cortex.outputs.digest }}
          push-to-registry: true
